<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Christmas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #13294b 0%, #070d19 75%);
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    canvas {
      display: block;
    }
    .wish {
      position: fixed;
      bottom: 28px;
      width: 100%;
      text-align: center;
      color: #fff3c4;
      font-size: 10px;
      letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(255, 215, 100, 0.85);
      pointer-events: none;
    }
    .wish2 {
      position: fixed;
      bottom: 64px;
      width: 100%;
      text-align: center;
      color: #ffcbc4;
      font-size: 24px;
      letter-spacing: 4px;
      text-shadow: 0 0 12px rgba(255, 215, 100, 0.85);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="wish2">Dear 于诗媛</div>
  <div class="wish">圣诞快乐 · Merry Christmas</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const ornaments = [];
    const totalPoints = 900;
    const colors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#ff924c", "#ffffff"];

    for (let i = 0; i < totalPoints; i++) {
      const t = i / totalPoints;
      const angle = t * Math.PI * 36;
      const radius = t * Math.min(width, height) * 0.24;
      const y = (t - 0.5) * Math.min(width, height) * 0.58;
      const isBulb = i % 14 === 0;
      ornaments.push({
        angle,
        radius,
        y,
        size: isBulb ? 4.2 : 1.8,
        color: isBulb ? colors[i % colors.length] : (i % 2 === 0 ? "#2ecc71" : "#27ae60"),
        twinkleOffset: Math.random() * Math.PI * 2,
        isBulb
      });
    }

    const snowflakes = Array.from({ length: 120 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2.5 + 0.8,
      speedY: Math.random() * 1.2 + 0.5,
      speedX: Math.random() * 0.6 - 0.3,
      alpha: Math.random() * 0.7 + 0.3
    }));

    function drawStar(cx, cy, spikes, outerRadius, innerRadius, time) {
      let rot = (Math.PI / 2) * 3 + Math.sin(time * 2) * 0.08;
      const step = Math.PI / spikes;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
        rot += step;
      }
      ctx.closePath();
      ctx.fillStyle = "#ffd166";
      ctx.shadowColor = "#ffbe0b";
      ctx.shadowBlur = 22;
      ctx.fill();
      ctx.restore();
    }

    let rotation = 0;

    function animate(now) {
      const time = now * 0.001;
      ctx.clearRect(0, 0, width, height);

      // 绘制雪花
      for (const flake of snowflakes) {
        flake.y += flake.speedY;
        flake.x += flake.speedX + Math.sin(time + flake.y * 0.01) * 0.25;
        if (flake.y > height) {
          flake.y = -5;
          flake.x = Math.random() * width;
        }
        if (flake.x > width) flake.x = 0;
        if (flake.x < 0) flake.x = width;

        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${flake.alpha})`;
        ctx.fill();
      }

      rotation += 0.012;
      const centerX = width / 2;
      const centerY = height / 2 + 15;

      // 树干
      ctx.fillStyle = "#5c3a21";
      ctx.fillRect(centerX - 16, centerY + Math.min(width, height) * 0.29, 32, 36);

      // 排序以实现前后遮挡
      const projected = ornaments.map((p) => {
        const theta = p.angle + rotation;
        const x3d = Math.cos(theta) * p.radius;
        const z3d = Math.sin(theta) * p.radius;
        const scale = 1 + z3d / (Math.max(width, height) * 0.9);
        return {
          x: centerX + x3d * scale,
          y: centerY + p.y * scale,
          z: z3d,
          size: p.size * scale,
          color: p.color,
          isBulb: p.isBulb,
          twinkle: 0.65 + 0.35 * Math.sin(time * 4 + p.twinkleOffset)
        };
      }).sort((a, b) => a.z - b.z);

      for (const pt of projected) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, Math.max(0.8, pt.size), 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.isBulb ? pt.twinkle : 0.85;
        if (pt.isBulb) {
          ctx.shadowColor = pt.color;
          ctx.shadowBlur = 14;
        }
        ctx.fill();
        ctx.restore();
      }

      // 树顶星星
      drawStar(centerX, centerY - Math.min(width, height) * 0.31, 5, 18, 8, time);

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
